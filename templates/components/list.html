<div class="table-card">
    <table class="data-table">
        <thead>
            <tr>
                {% for header in headers %}
                <th>{{ header }}</th>
                {% endfor %}
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                {% for value in row.values.values %}
                <td>{{ value }}</td>
                {% endfor %}

                <td>
                    <div class="flex gap-8">
                        <a class="btn btn-secondary btn-sm"
                        href="{{ request.path }}modify/{{ row.meta.id }}/">Modifier</a>
                        <form method="POST"
                              action="{{ row.meta.delete_url}}"
                              hx-post="{{ row.meta.delete_url}}"
                              hx_target="closest tr"
                              hx-swap="outerHTML"
                              hx-confirm="Are you sure you want to delete this item?">
                        
                            {% csrf_token %}
                            <button type="submit"
                                    hx-target="closest tr"
                                    hx-swap="outerHTML"
                                    class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
